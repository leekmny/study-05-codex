<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="하루를 기록하고 글에 담긴 감정을 살펴보는 실습 도구입니다.">
  <title>AI 공감 다이어리 | 14장 AI 실습</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body class="diary" data-page="diary">
  <header class="site-header">
    <div class="shell header-row">
      <span class="site-name">14장 AI 실습</span>
      <nav aria-label="실습 앱">
        <a href="/index.html" aria-current="page">공감 다이어리</a>
        <a href="/index_pdf.html">PDF 요약</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <div class="page-intro">
      <h1>AI 공감 다이어리</h1>
      <p id="privacy-note">입력한 일기는 외부 AI 모델로 전송됩니다. 실습용으로 지어낸 내용만 입력해 주세요.</p>
    </div>

    <noscript><p class="notice">감정 분석과 브라우저 저장을 사용하려면 JavaScript를 켜 주세요.</p></noscript>

    <div class="workspace">
      <form class="panel entry-panel" id="diary-form" method="post">
        <label class="section-title" for="diary-text">오늘의 기록</label>
        <textarea id="diary-text" name="text" rows="6" maxlength="4000" required
          aria-describedby="privacy-note" placeholder="예: 어려운 실습 과제를 끝내고 뿌듯했다."></textarea>
        <button type="submit" disabled>감정 분석하기</button>
        <p class="status" id="request-status" role="status"></p>
        <p class="notice notice-error" id="request-error" role="alert"></p>
      </form>

      <section class="panel result-panel" aria-labelledby="result-heading" id="result-panel">
        <h2 id="result-heading">감정 분석 결과</h2>
        <p class="empty" id="result-empty">분석한 감정과 공감 메시지가 여기에 표시됩니다.</p>
        <div class="skeleton" id="result-loading" aria-hidden="true" hidden><span></span><span></span></div>
        <div id="result-content" hidden>
          <p class="emotion" id="result-emotion"></p>
          <p class="result-copy" id="result-message"></p>
          <p class="result-meta">응답 모델 <span id="result-model"></span></p>
        </div>
      </section>
    </div>

    <section class="history" aria-labelledby="history-heading">
      <div class="history-heading">
        <h2 id="history-heading">지난 기록</h2>
        <p>이 브라우저에 저장</p>
      </div>
      <p class="empty" id="history-empty">감정 분석을 마치면 최신 기록부터 표시됩니다.</p>
      <ol id="history-list" class="history-list" hidden></ol>
    </section>
  </main>
</body>
</html>
